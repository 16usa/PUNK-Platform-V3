kind = "web"
previewPath = "/"
title = "PUNK Platform V3"
description = "An existing PUNK meme-token launchpad concept adapted from the supplied source archive. Includes demo token discovery, simulated trading, token creation, creator profiles, portfolio, and reference designs; it does not connect to Solana, wallets, or live X Money services."
version = "1.0.0"
id = "artifacts/punk-platform-v3"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20334

[services.development]
run = "pnpm --filter @workspace/punk-platform-v3 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/punk-platform-v3", "run", "build" ]
serve = "static"
publicDir = "artifacts/punk-platform-v3/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20334"
BASE_PATH = "/"
